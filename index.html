<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đố vui theo sách</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f3efff;color:#222;text-align:center}
  header{background:#6a3fd0;color:#fff;padding:12px;font-size:20px;font-weight:bold}
  main{max-width:640px;margin:0 auto;padding:12px}
  input{width:92%;padding:10px;font-size:15px;border:2px solid #aaa;border-radius:8px}
  button{font-size:20px;font-weight:bold;border:3px solid #222;border-radius:14px;padding:14px 22px;margin:6px;cursor:pointer;color:#fff}
  .b-q{background:#e67e22}.b-s{background:#27ae60}.b-a{background:#9966ff;min-width:90px}
  .b-r{background:#e74c3c}.b-g{background:#777;font-size:14px;padding:8px 12px}.b-go{background:#2f7fd1}
  #cam{display:inline-block;border:4px solid #6a3fd0;border-radius:12px;overflow:hidden;min-height:60px}
    .ans{display:inline-block;text-align:left;margin-top:6px}
  #msg{font-size:22px;line-height:1.5;min-height:60px;margin:10px;font-weight:bold;white-space:pre-line}

  #cam:empty{display:none}
  #bar{font-size:14px;color:#555}
</style>
</head>
<body>
<header>📚 Đố vui theo sách (Teachable Machine)</header>
<main>
  <div id="setup">
    <p>Dán link model Teachable Machine (dạng <code>https://teachablemachine.withgoogle.com/models/xxxx/</code>):</p>
    <input id="url" placeholder="Link model">
    <div><button class="b-go" onclick="startCam()">Bật camera & nhận diện</button></div>
    <p>Chưa có model? Chọn môn thủ công để thử:</p>
    <div id="manual"></div>
  </div>

  <div id="cam"></div>
  <div id="bar"></div>
  <div id="msg">Chọn cách bắt đầu ở trên</div>

  <div id="menu" class="hide">
    <button class="b-q" onclick="startQuiz()">CÂU HỎI</button>
    <button class="b-s" onclick="doSummary()">TÓM TẮT</button>
    <div><button class="b-g" onclick="rescan()">Quét sách khác</button></div>
  </div>

  <div><button id="back" class="b-r hide" onclick="backToMenu()">QUAY LẠI</button></div>

  <div id="answers" class="hide">
    <button class="b-a" onclick="answer(0)">A</button>
    <button class="b-a" onclick="answer(1)">B</button>
    <button class="b-a" onclick="answer(2)">C</button>
    <button class="b-r" onclick="backToMenu()">QUAY LẠI</button>
  </div>
</main>

const NGUONG = 0.9;      // độ tin cậy tối thiểu
const SO_KHUNG = 8;      // số lần liên tiếp nhận cùng một môn mới chấp nhận

// ====== Âm thanh: chỉ dùng file mp3 trong thư mục audio (không dùng giọng máy) ======
// iPad/iPhone chỉ cho phát tiếng khi "đã được mở khóa" bằng một lần chạm màn hình.
// Nên dùng MỘT thẻ audio dùng chung, mở khóa ở lần chạm đầu tiên, sau đó chỉ đổi src.
let ac=null;
const player=new Audio();
player.preload='auto';
player.setAttribute('playsinline','');
let oscs=[],playTok=0,unlocked=false;
function unlockAudio(){
  if(unlocked)return;
  unlocked=true;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
  player.muted=true;
  player.src='audio/lsdl_cau1.mp3';
  player.play().then(()=>{if(player.muted){player.pause();player.muted=false;}}).catch(()=>{player.muted=false;});
}
['pointerdown','touchstart','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true}));
function stopAudio(){
  playTok++;
  try{player.pause();}catch(e){}
  oscs.forEach(o=>{try{o.stop();}catch(e){}});oscs=[];
}
function play(src){
  stopAudio();
  if(!src)return Promise.resolve();
  return new Promise(res=>{
    player.muted=false;
    player.onended=res;player.onerror=res;
    player.src=src;
    player.currentTime=0;
    player.play().catch(err=>{console.warn('Không phát được',src,err);res();});
  });
}
// tiếng "ting" (đúng) và "bụp" (sai), không có giọng nói
function beep(ok){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const notes=ok?[[660,0],[880,0.15]]:[[220,0],[160,0.18]];
    notes.forEach(([f,t])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=ok?'sine':'square';o.frequency.value=f;
      g.gain.setValueAtTime(0.2,ac.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+0.25);
      o.connect(g);g.connect(ac.destination);oscs.push(o);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.26);
    });
  }catch(e){}
  return new Promise(r=>setTimeout(r,700));
}
const $=id=>document.getElementById(id);
const show=(id,on)=>$(id).classList.toggle('hide',!on);
const say=t=>{$('msg').textContent=t;};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();

// ====== Trạng thái ======
let run=0;
let started=false,camActive=false;
let model,webcam,mode='idle',mon=-1,qi=0,diem=0,streak=0,last=-1;

$('manual').innerHTML=MON.map((m,i)=>`<button class="b-g" onclick="chonMon(${i})">${m.ten}</button>`).join('');

async function startCam(){
  const base=$('url').value.trim();
  if(!base){say('Hãy dán link model trước.');return;}
  const url=base.endsWith('/')?base:base+'/';
  show('menu',false);show('answers',false);show('back',false);
  let stage='';
  try{
    stage='kiểm tra camera';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
      throw new Error('Trình duyệt không cho dùng camera ở trang này (hãy mở bằng Chrome)');
    const st=await navigator.mediaDevices.getUserMedia({video:true});
    st.getTracks().forEach(t=>t.stop());
    stage='tải thư viện';
    if(typeof tmImage==='undefined'||typeof tf==='undefined')
      throw new Error('Không tải được thư viện Teachable Machine, kiểm tra internet');
    stage='tải model';say('Đang tải model...');
    model=await tmImage.load(url+'model.json',url+'metadata.json');
    stage='bật camera';
    await camOn();
    show('setup',false);
    started=true;
    await rescan();
    requestAnimationFrame(loop);
  }catch(e){
    const m=(e&&(e.message||e.name))||String(e);
    console.error(stage,e);
    say('Lỗi ở bước "'+stage+'": '+m);
  }
}
async function camOn(){
  webcam=new tmImage.Webcam(320,320,true);
  await webcam.setup(); await webcam.play();
  $('cam').innerHTML=''; $('cam').appendChild(webcam.canvas);
  camActive=true;
}
function camOff(){
  try{if(webcam)webcam.stop();}catch(e){}
  camActive=false;
  $('cam').innerHTML='';$('bar').textContent='';
}
async function loop(){
  if(mode==='scan'&&camActive){
    webcam.update();
    const p=await model.predict(webcam.canvas);
    if(mode==='scan'){
      let best=p.reduce((a,b)=>b.probability>a.probability?b:a);
      const idx=MON.findIndex(m=>m.kw.some(k=>norm(best.className).includes(k)));
      $('bar').textContent=`${best.className}: ${(best.probability*100).toFixed(0)}%`;
      if(idx>=0&&best.probability>=NGUONG){
        streak=(idx===last)?streak+1:1; last=idx;
        if(streak>=SO_KHUNG){chonMon(idx);}
      }else{streak=0;last=-1;}
    }
  }
  requestAnimationFrame(loop);
}
async function rescan(){
  run++;stopAudio();
  mon=-1;streak=0;last=-1;
  show('menu',false);show('answers',false);show('back',false);
  if(!started){mode='idle';show('setup',true);say('Dán link model và bấm "Bật camera & nhận diện" ở trên.');return;}
  mode='loading';
  say('Đang bật camera...');
  try{
    if(!camActive)await camOn();
    mode='scan';
    say('Hãy đưa sách vào camera...');
  }catch(e){
    mode='idle';
    say('Không bật được camera: '+((e&&(e.message||e.name))||e));
  }
}
async function chonMon(i){
  mon=i;mode='menu';camOff();
  show('menu',true);show('answers',false);
  say('Đã nhận ra sách: '+MON[i].ten+'\nChọn CÂU HỎI hoặc TÓM TẮT');
}
function backToMenu(){
  run++;stopAudio();mode='menu';
  show('answers',false);show('back',false);show('menu',true);
  say('Đã nhận ra sách: '+MON[mon].ten+'\nChọn CÂU HỎI hoặc TÓM TẮT');
}
async function doSummary(){
  const t=++run;
  show('menu',false);show('back',true);
  say('Tóm tắt: '+MON[mon].ten+'\n'+MON[mon].tomtat);
  await play('audio/'+MON[mon].id+'_tomtat.mp3');
  if(t!==run)return;
  show('back',false);show('menu',true);
}
function startQuiz(){
  run++;qi=0;diem=0;mode='quiz';
  show('menu',false);show('answers',true);
  speakQ();
}
function showQ(){
  const q=MON[mon].q[qi],m=$('msg');
  m.innerHTML='';
  const h=document.createElement('div');h.textContent=`Câu ${qi+1}: ${q[0]}`;
  const box=document.createElement('div');box.className='ans';
  ['A','B','C'].forEach((L,i)=>{const d=document.createElement('div');d.textContent=`Đáp án ${L}: ${q[i+1]}`;box.appendChild(d);});
  m.appendChild(h);m.appendChild(box);
}
function qText(){
  const q=MON[mon].q[qi];
  return `Câu ${qi+1}: ${q[0]}\nĐáp án A: ${q[1]}\nĐáp án B: ${q[2]}\nĐáp án C: ${q[3]}`;
}
async function speakQ(){
  const q=MON[mon].q[qi];
  showQ();
  await play('audio/'+MON[mon].id+'_cau'+(qi+1)+'.mp3');
}
async function answer(k){
  if(mode!=='quiz')return;
  mode='wait';const t=run;
  const q=MON[mon].q[qi],L='ABC'[q[4]];
  if(k===q[4]){diem++;stopAudio();say('QUÁ ĐÚNG! 🎉');await beep(true);}
  else{stopAudio();say('SAI RỒI! Đáp án là '+L);await beep(false);}
  if(t!==run)return;
  qi++;
  if(qi<3){mode='quiz';speakQ();}
  else{
    show('answers',false);
    const tx=`Điểm của bạn: ${diem} / 3`;
    say(tx);await new Promise(r=>setTimeout(r,3500));
    if(t!==run)return;
    rescan();
  }
}
</script>
</body>
